appId: ${APP_ID}
name: iOS Reviereinrichtung - Detailgalerie und Standort
tags:
  - ios
  - reviereinrichtungen
  - galerie
---
- launchApp
- openLink: hege://reviereinrichtung/${HEGE_UI_FACILITY_ID}
- extendedWaitUntil:
    visible: 1 / 3
    timeout: 15000
- swipe:
    start: 88%, 36%
    end: 12%, 36%
    duration: 600
- extendedWaitUntil:
    visible: 2 / 3
    timeout: 5000
- scrollUntilVisible:
    element:
      id: reviereinrichtung-detail-map
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: reviereinrichtung-google-maps-link
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: reviereinrichtung-google-maps-link
