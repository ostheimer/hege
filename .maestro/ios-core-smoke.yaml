appId: ${APP_ID}
name: iOS core smoke - field role
tags:
  - ios
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: login-build-tag
- assertVisible: App-Version ${BUILD_TAG}
- tapOn:
    id: login-identifier-input
- inputText: ${HEGE_SMOKE_IDENTIFIER}
- tapOn:
    id: login-pin-input
- inputText: ${HEGE_SMOKE_PIN}
- tapOn:
    id: login-submit-button
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-about-link
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 15000
- assertVisible:
    id: about-build-tag
- assertVisible: App-Stand ${BUILD_TAG}
- back
- extendedWaitUntil:
    visible:
      id: more-screen
    timeout: 15000
- tapOn:
    id: more-contacts-link
- extendedWaitUntil:
    visible:
      id: contacts-screen
    timeout: 15000
- assertVisible: Mitglieder der Jagdgesellschaft
- assertNotVisible: Listen und Kontakte
